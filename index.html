<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <script>
    (function(){
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;

      // Google Consent Mode v2 - Strict EU GDPR Default (Denied)
      gtag("consent", "default", {
        "analytics_storage": "denied",
        "ad_storage": "denied",
        "ad_user_data": "denied",
        "ad_personalization": "denied",
        "wait_for_update": 500
      });
      gtag("js", new Date());

      var g="%VITE_GA_MEASUREMENT_ID%";
      var adsId="AW-18490594666";
      var tagId = (g && g.startsWith("G-")) ? g : adsId;
      var loaded=false;
      function initGA(){
        if(loaded)return;
        loaded=true;
        var s=document.createElement("script");
        s.async=true;
        s.src="https://www.googletagmanager.com/gtag/js?id="+tagId;
        document.head.appendChild(s);
        if(g && g.startsWith("G-")) {
          gtag("config", g);
        }
        gtag("config", adsId);
      }
      window.initGA = initGA;

      // Check if consent was already granted in previous session
      try {
        var savedConsent = localStorage.getItem("cc_cookie");
        if (savedConsent) {
          var parsed = JSON.parse(savedConsent);
          if (parsed && parsed.categories && (parsed.categories.indexOf("analytics") !== -1 || parsed.categories.indexOf("marketing") !== -1)) {
            initGA();
          }
        }
      } catch(e){}
    })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
