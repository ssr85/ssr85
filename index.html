<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <script>
    (function(){
      var g="%VITE_GA_MEASUREMENT_ID%";
      if(!g||!g.startsWith("G-"))return;
      var loaded=false;
      function initGA(){
        if(loaded)return;
        loaded=true;
        var s=document.createElement("script");
        s.async=true;
        s.src="https://www.googletagmanager.com/gtag/js?id="+g;
        document.head.appendChild(s);
        window.dataLayer=window.dataLayer||[];
        function gtag(){dataLayer.push(arguments)}
        gtag("js",new Date());
        gtag("config",g);
      }
      var events=["pointerdown","scroll","touchstart","keydown"];
      function onInteract(){
        initGA();
        events.forEach(function(e){window.removeEventListener(e,onInteract,{passive:true})});
      }
      events.forEach(function(e){window.addEventListener(e,onInteract,{passive:true})});
      if(window.requestIdleCallback){
        window.requestIdleCallback(function(){setTimeout(initGA,3500)});
      }else{
        setTimeout(initGA,4000);
      }
    })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
